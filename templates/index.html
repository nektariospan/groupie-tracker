<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Groupie Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1><a href="/">🎸 Groupie Tracker</a></h1>
    <div class="pagination-controls">
      Show:
      <a href="/?limit=5&page=1" class="{{if eq .Limit "5"}}active{{end}}">5</a> |
      <a href="/?limit=10&page=1" class="{{if or (eq .Limit "10") (and (ne .Limit "5") (ne .Limit "20"))}}active{{end}}">10</a> |
      <a href="/?limit=20&page=1" class="{{if eq .Limit "20"}}active{{end}}">20</a> bands
      <span style="margin-left:2rem;">
        {{if .HasPrevious}}
          <a href="/?limit={{.Limit}}&page={{.PreviousPage}}" class="nav-button prev-button">← Previous</a>
        {{end}}
        {{if .HasNext}}
          <a href="/?limit={{.Limit}}&page={{.NextPage}}" class="nav-button next-button">Next →</a>
        {{end}}
      </span>
    </div>
    <div class="artist-grid">
      {{range .Artists}}
      <div class="artist-card">
        <a href="/artist/{{.ID}}">
          <img src="{{.Image}}" alt="{{.Name}}">
          <div class="artist-name">{{.Name}}</div>
        </a>
      </div>
      {{end}}
    </div>
  </div>
</body>
</html>
